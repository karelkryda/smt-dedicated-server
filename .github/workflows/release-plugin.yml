name: Plugin release

on:
  push:
    tags:
      - plugin/v*

permissions:
  contents: write

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  release-plugin:
    name: Plugin release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Build plugin
        run: dotnet build plugin/AutoHost.csproj -c Release

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#plugin/}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: "AutoHost ${{ steps.version.outputs.version }}"
          files: plugin/bin/Release/netstandard2.1/AutoHost.dll
